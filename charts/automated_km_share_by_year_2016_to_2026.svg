<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Share of new metro lines worldwide that are automated (above GoA2), by year</title>
<desc id="d">2659.9 of 7903.35 new grade-separated, non-mainline urban rail lines opened from 2016 to 2026-09-29 are automated.</desc>
<style>
.bg{fill:#fcfcfb}.bar{fill:#2a78d6}.bar.partial{fill-opacity:.55}
.grid{stroke:#e4e3df;stroke-width:1}.axis{stroke:#a3a29c;stroke-width:1}
.t1{fill:#0b0b0b}.t2{fill:#52514e}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.bar{fill:#3987e5}.grid{stroke:#2e2e2c}.axis{stroke:#5d5c57}
.t1{fill:#ffffff}.t2{fill:#c3c2b7}}
</style>
<rect class="bg" width="760" height="436" rx="8"/>
