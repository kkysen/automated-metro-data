<rect x="675.2" y="72" width="68.8" height="284" fill="transparent"/>
<path class="bar" d="M685.5,356.0 V152.5 Q685.5,148.5 689.5,148.5 H729.7 Q733.7,148.5 733.7,152.5 V356.0 Z"/>
