<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Share of new metro lines in mainland China that are automated (GoA3/GoA4), by year</title>
<desc id="d">70 of 236 new grade-separated, non-mainline urban rail lines opened from 2016 to 2026-09-29 are automated.</desc>
