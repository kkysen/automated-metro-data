<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Share of new metro lines outside mainland China that are automated (above GoA2), by year</title>
<desc id="d">53 of 116 new grade-separated, non-mainline urban rail lines opened from 2016 to 2025-12-26 are automated.</desc>
<style>
.bg{fill:#fcfcfb}.bar{fill:#2a78d6}.bar.partial{fill-opacity:.55}
.grid{stroke:#e4e3df;stroke-width:1}.axis{stroke:#a3a29c;stroke-width:1}
.t1{fill:#0b0b0b}.t2{fill:#52514e}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.bar{fill:#3987e5}.grid{stroke:#2e2e2c}.axis{stroke:#5d5c57}
.t1{fill:#ffffff}.t2{fill:#c3c2b7}}
</style>
<rect class="bg" width="760" height="436" rx="8"/>
<text class="t1" x="56" y="28" font-size="17" font-weight="600">Automated share of new metro lines, outside mainland China</text>
<text class="t2" x="56" y="50" font-size="13">Above GoA2; new-build, grade-separated, non-mainline lines; 53 of 116 (46%) in 2016–2025</text>
<line class="axis" x1="56" x2="744" y1="356.0" y2="356.0"/>
<text class="t2" x="48" y="360.0" font-size="12" text-anchor="end">0%</text>
<line class="grid" x1="56" x2="744" y1="285.0" y2="285.0"/>
<text class="t2" x="48" y="289.0" font-size="12" text-anchor="end">25%</text>
<line class="grid" x1="56" x2="744" y1="214.0" y2="214.0"/>
<text class="t2" x="48" y="218.0" font-size="12" text-anchor="end">50%</text>
<line class="grid" x1="56" x2="744" y1="143.0" y2="143.0"/>
<text class="t2" x="48" y="147.0" font-size="12" text-anchor="end">75%</text>
<g><title>2016: 5 of 10 new lines automated (50%)</title>
<rect x="56.0" y="72" width="68.8" height="284" fill="transparent"/>
<path class="bar" d="M66.3,356.0 V218.0 Q66.3,214.0 70.3,214.0 H110.5 Q114.5,214.0 114.5,218.0 V356.0 Z"/>
<text class="t1" x="90.4" y="208.0" font-size="12" text-anchor="middle">50%</text>
</g>
<text class="t1" x="90.4" y="374.0" font-size="12" text-anchor="middle">2016</text>
<text class="t2" x="90.4" y="390.0" font-size="11" text-anchor="middle">5/10</text>
